name: Test Azure Connection

on:
  push:
    branches: [ "**" ] # Triggers on any branch push for testing

permissions:
  id-token: write # Mandated by Azure OIDC
  contents: read

jobs:
  validate-connection:
    runs-on: ubuntu-latest
    environment: learning # 👈 Matches your environment name perfectly
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Connect to Azure via OIDC
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Verify Account Access
      run: |
        az account show
